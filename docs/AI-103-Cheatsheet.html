.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px}

tr:last-child td{border-bottom:0}

tr.off,section.off{display:none}
.tip{margin:8px 0 0;padding:6px 10px;background:var(--hl);border-left:3px solid #c98a0b;border-radius:0 4px 4px 0;font-size:.86rem}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--head);padding:1px 4px;border-radius:3px}
footer{margin-top:36px;color:var(--muted);font-size:.8rem}
@media print{.bar{position:static}.toc{display:none}body{background:#fff}}
